# GLM-5.3-Flash-EXL3 on two DGX Sparks with TensorFold. Names mirror the
# Ansible inventory vars (gpu_fabric_interface <-> topology.fabric.interface, ...).
# See ENVS.md.

nameOverride: ""
fullnameOverride: ""

image:
  # Upstream publishes the image at this registry path (its local docker name is
  # `tensorfold-glm53`; the registry repo is the long form below).
  repository: ghcr.io/miaai-lab/glm-5.3-flash-exl3-2x-dgx-sparks-tensorfold
  # Pinned image (upstream main after v1.10: TensorFold v0.6.0 + 107 patches). See SYNC.md.
  tag: "v0.6.0-e66c657a433d"
  # Optional immutable pin; wins over tag when set (e.g. "sha256:...").
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

model:
  # EXL3 4bpw quant built for TensorFold. `repo`/`dirName` default to the standard
  # published checkpoint, or to the Ablit weights when `ablit: true` (set them
  # explicitly to override). `prepare-model.sh` performs the download on the hosts.
  repo: ""                  # default: Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold (or Ablit when ablit=true)
  revision: ""              # informational; prepare-model.sh pins the download
  servedName: GLM-5.3-Flash-EXL3
  # Mount-point name under /models inside the pod (host path is weights.hostPath.*).
  dirName: ""               # default: repo basename
  # Gated Ablit weights (upstream v1.7). The repo requires accepting its terms and
  # an HF_TOKEN to download. With ablit=true the chart serves the Ablit checkpoint
  # and defaults `serving.thinking` to false (the Ablit weights answer best directly).
  ablit: false
  ablitRepo: Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold-Ablit
  ablitRevision: 57edefd2f5d9b371c8345883304d5af68b52fa24
  # DFlash2 drafter (incoai/GLM-5.3-Flash-DFlash2): downloaded by prepare-model.sh
  # into <models-dir>/<drafterDirName> and mounted alongside the weights.
  drafter:
    repo: incoai/GLM-5.3-Flash-DFlash2
    revision: bf582e4eacc1810f76656d1811693ff6c6737d2a
    dirName: GLM-5.3-Flash-DFlash2

topology:
  # Node selection. Ansible sets these labels at k3s registration.
  rankLabels:
    key: node.tensorfold/rank
    leader: leader
    worker: worker
  gpuToleration:
    key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  fabric:
    # REQUIRED - hardware/network specific, no defaults.
    masterAddr: ""     # leader's address on the point-to-point fabric
    workerAddr: ""     # worker's address on the fabric (beacon target)
    interface: ""      # NCCL_SOCKET_IFNAME: netdev carrying the fabric (see `ip -br link`)
    rdmaDevice: ""     # NCCL_IB_HCA: RDMA device(s) of that port (see /sys/class/infiniband);
                       # a wrong value silently falls back to TCP. One QSFP port of a GB10 is
                       # two PCIe x4 rails (e.g. rocep1s0f0 and roceP2p1s0f0): list both,
                       # comma-separated, once both twins carry an address, and NCCL and the
                       # RoCE all-gathers use both (a prompt chunk's gather ~1.8x faster).
    gidIndex: ""       # NCCL_IB_GID_INDEX (also the RoCE all-gathers'): the RoCE v2 IPv4 GID.
                       # Empty: NCCL picks one, the all-gathers use index 3.
    ncclChannels: 4    # NCCL_MIN/MAX_NCHANNELS (recipe: 4); empty leaves NCCL's default
    port: 25000                   # torch.distributed master port
    beaconPort: 25099

weights:
  # Full checkpoint directory on each node (REQUIRED; worker unless nfs.enabled).
  # Paths may differ per node.
  hostPath:
    leader: ""
    worker: ""
  # DFlash2 drafter checkpoint (REQUIRED when serving.speculative.method is a drafter,
  # i.e. anything but `none`/`auto`). Same per-node layout as the weights.
  drafter:
    hostPath:
      leader: ""
      worker: ""
  # Opt-in: worker mounts the leader's copy over the fabric instead of its own hostPath.
  nfs:
    enabled: false
    server: ""
    path: ""

serving:
  tensorParallelSize: 2      # fixed by topology; informational
  maxModelLen: "1048576"      # 1M-token context (--context); quoted so Helm does not render it as 1.048576e+06
  # Reply budget (reasoning + answer) when a request sets no max_tokens (--max-tokens).
  # 32768 as in the recipe: GLM thinks at Max, and TensorFold's 4096 can end a reply
  # inside its reasoning or a tool call.
  maxTokens: 32768
  kvCacheDtype: fp8           # FP8 KV cache (TF_GLM_KV=fp8); bf16|int8|int4 via --kv-dtype
  # thinking defaults to `true`, or `false` with model.ablit=true (the Ablit weights
  # answer best directly). Set it explicitly to force a value.
  thinking: null
  vision: false               # enable image/video input (--vision; rank 0 runs the vision tower)
  speculative:
    method: dflash2           # --drafter: none|auto to disable, otherwise the mounted drafter is used
    numTokens: 7              # informational; DFlash2 draft count is set by the drafter config, not a serve flag
  parallelRequests: 4         # concurrent request streams (--parallel)
  extraArgs: ""
  extraEnv: []                # [{name: X, value: Y}]

# The recipe's TensorFold settings (upstream scripts/config.sh at the pinned recipe).
# The image bakes in none of them, and each patch's own default is mostly "off"
# (bf16 dense weights, NCCL for every gather, no copy drafts, no prefill split, no
# shared-prefix reuse ...), so without these the server runs well below the recipe's
# published speed. Rendered as env on both ranks, sorted by name. Override one key
# here (not in serving.extraEnv, which would duplicate it); set it to null to leave
# the patch default. See ENVS.md for what each does.
#
# Derived from serving.parallelRequests unless set here, as in the recipe:
#   TF_GLM_MULTI_WINDOW           32, or 64 past 4 requests
#   TF_ROCE_MAX_KB                512, or 16 x the window past 32 rows
#   TENSORFOLD_MEMORY_RESERVE_GIB 14.5 + 0.95 a request past 4 + 0.04 a row past 32
tuning:
  env:
    # 4-bit dense weights (head FP8): the largest decode/prefill gain. Lossy; upstream
    # issue #18: short non-English prompts can lose the end of turn ("fp8" keeps it,
    # ~10% slower decode; "bf16" the checkpoint as is).
    TF_GLM_DENSE: q4
    # Small all-gathers as one-shot RDMA writes over the RoCE link (patch 0006), +6% decode.
    TF_GLM_COMM: roce
    TF_ROCE_WAIT_S: "300"            # the patch's 20 s took both ranks down on long prompts (#54)
    # Sampled decode (temperature 1, top_p 0.95) draws from the top_p nucleus (patch 0034).
    # Stock v0.6.0 tests each rank's candidates alone, which fails whenever two ranks hold
    # part of the nucleus, so every such step gathered and sorted the whole vocabulary on
    # the CPU: ~15 tok/s against greedy's ~58 on two Sparks (#91). 1 (the recipe's value)
    # tests the ranks' candidates together: the same nucleus and the same draw, 42-61 tok/s.
    TENSORFOLD_NUCLEUS_UNION: "1"
    # Drafting
    TF_GLM_DFLASH_POLICY: "fnc7:0.3"
    TF_GLM_COPY_DRAFTS: "1"
    TF_GLM_COPY_MAX: "15"
    TF_GLM_WIDE_GRAPHS: "16"
    TF_GLM_COPY_REPLY_MATCH: "16"
    TF_GLM_MTP: auto
    # Prefill
    TF_GLM_HC_SPLIT: "1"
    TF_GLM_PREFILL_OVERLAP: "2"
    TF_GLM_KDA_CHUNKED: "1"
    TF_GLM_MULTI_PREFILL: "1"
    TF_GLM_FILL_BUDGET_MS: "200"
    TF_GLM_FILL_DRAFTS: "1"
    # Rows of a prompt chunk that fills while other requests decode (TensorFold's own default
    # is 1024). 2048 is the whole prompt chunk (TF_GLM_PREFILL_ROWS), whose buffers already
    # exist: the same memory and the same replies in half the passes over the weights
    # (upstream, three Sparks: a cold 256k prompt beside a streaming reply 132 -> 114 s).
    # At most TF_GLM_PREFILL_ROWS; with FILL_BUDGET_MS=0 a chunk now pauses the other replies
    # ~1.3 s instead of ~0.65 s. "1024": as before.
    TF_GLM_FILL_ROWS: "2048"
    # Decode kernels
    TF_GLM_L2PF: "1"
    TF_GLM_EXL3_LOADS: nc
    # The decode expert kernel's launch order (patch 0090): 0 the grid as launched. Same
    # bits for every value; the author's single-stream gain for 1 is +2.2%, not yet
    # measured on two Sparks.
    TF_GLM_EXL3_DEC_ORDER: "0"
    # Concurrency, prompt reuse, memory
    TF_GLM_MULTI_LONE: "0"
    TF_GLM_SHARED_PREFIX: "1"
    TF_GLM_CACHE_ENTRIES: "32"
    # Each kept state is also a reservation (~91 MiB measured on two Sparks), so this count
    # is what the pool shrinks by, and a pool with millions of free tokens can still evict a
    # live conversation at the 33rd state (#84). 0 off; 50 makes the count at least half of
    # the pool's ~7.5 GiB budget here, 75 the ceiling. Watch /health kept_prompts against
    # pool_free_tokens: pinned at this count with a free pool is the symptom.
    TF_GLM_CACHE_SHARE_PCT: "0"
    # The kept states also own device memory outside the pool (their DFlash2 window copies
    # and recurrent state; patch 0089). 0 is no cap; above it the least valuable state is
    # dropped and its blocks go back to the driver. KEEP_PER_CHAT bounds one conversation's
    # own turn-boundary states instead (the patch author runs 2), so a single long chat
    # cannot fill the entries alone. Neither is written to the spill tier when it drops.
    TF_GLM_KEPT_BYTES_GIB: "0"
    TF_GLM_KEEP_PER_CHAT: "0"
    TF_GLM_CACHE_GIB: "12.5"
    TF_GLM_CLEAR_THINKING: "0"
    # The reasoning-effort line is token 3 of the checkpoint's prompt, so switching effort or
    # thinking mid-conversation changes the whole prompt and misses the kept-prompt cache
    # (#93). 1 (patch 0096) renders it at the tail instead, keeping the conversation identical
    # across switches. Off: it moves a line the model saw first in training, so A/B the effort
    # levels before relying on it.
    TF_GLM_EFFORT_TAIL: "0"
    # The GB10 firmware keeps ~2 GiB for a screen a headless Spark never uses (patch 0072).
    # 0 is off; DISPLAY_KV_BACKEND=drm maps the reservation on /dev/dri/card0, which the
    # chart does not mount. See the patch for the dispram backend of kindling spark-os.
    TF_GLM_DISPLAY_KV_MIB: "0"
    TF_GLM_DISPLAY_KV_BACKEND: drm
    # Streaming
    TF_GLM_STREAM_SMOOTH: "1"
    TF_GLM_STREAM_SMOOTH_MS: "400"
    TENSORFOLD_NO_UPDATE_CHECK: "1"

# Compiled CUDA kernels (the image's TORCH_EXTENSIONS_DIR / TRITON_CACHE_DIR under
# /cache). Empty: an emptyDir, so every pod start compiles them again. Set a host
# directory per rank to keep them; the chart uses a subdirectory per image, as the
# recipe's KERNEL_CACHE does, so a new image never reads an old image's kernels.
kernelCache:
  hostPath:
    leader: ""
    worker: ""

# /v1 is unauthenticated unless one of these is set. /health never needs a key.
auth:
  existingSecret: ""          # operator-managed Secret
  existingSecretKey: token    # key holding one or more space-separated API keys
  apiKey: ""                  # chart mints a Secret from this...
  apiKeys: []                 # ...or from this list

service:
  type: ClusterIP
  port: 8888

# Rendered only when `hosts` is non-empty.
ingress:
  className: ""
  annotations: {}
  hosts: []                   # e.g. [tensorfold.example.com]
  tls: []                     # [{secretName: x, hosts: [tensorfold.example.com]}]

shm:
  sizeLimit: 64Gi

resources:
  requests:
    cpu: "2"
    memory: 100Gi
  limits:
    nvidia.com/gpu: 1

runtimeClassName: nvidia

# Cold start (weights, profiling, KV sizing) takes tens of minutes
# up to ~2h; liveness only arms once startup succeeds.
probes:
  startup:
    initialDelaySeconds: 180
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 240
  liveness:
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 10
  readiness:
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

podAnnotations: {}