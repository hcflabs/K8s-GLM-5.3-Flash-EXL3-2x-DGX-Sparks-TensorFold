{{- range $c := list (dict "name" "leader" "rank" 0) (dict "name" "worker" "rank" 1) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "glm53.fullname" $ }}-{{ $c.name }}
  labels:
    {{- include "glm53.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "glm53.selectorLabels" (dict "root" $ "component" $c.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "glm53.labels" $ | nindent 8 }}
        {{- include "glm53.selectorLabels" (dict "root" $ "component" $c.name) | nindent 8 }}
      annotations:
        checksum/scripts: {{ printf "%s%s" (include (print $.Template.BasePath "/configmaps.yaml") $) ($.Files.Get "files/serve.sh") | sha256sum }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "glm53.podSpec" (dict "root" $ "rank" $c.rank "component" $c.name) | nindent 6 }}
---
{{ end }}