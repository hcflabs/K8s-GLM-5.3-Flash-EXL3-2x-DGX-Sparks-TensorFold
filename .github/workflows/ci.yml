name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: helm lint
        run: helm lint chart -f chart/ci/test-values.yaml
      - name: helm template (defaults, ingress, auth variants)
        run: |
          V=(-f chart/ci/test-values.yaml)
          helm template ci chart "${V[@]}" > /dev/null
          helm template ci chart "${V[@]}" --set 'ingress.hosts[0]=glm.example.com' > /dev/null
          helm template ci chart "${V[@]}" --set auth.apiKey=test > /dev/null
          helm template ci chart "${V[@]}" --set weights.nfs.enabled=true --set weights.nfs.server=192.0.2.1 --set weights.nfs.path=/m > /dev/null
          if helm template ci chart > /dev/null 2>&1; then echo "chart must require site values"; exit 1; fi
      - name: boolean serving flags render as serve.sh expects ("1"/"0")
        run: |
          set -euo pipefail
          V=(-f chart/ci/test-values.yaml)
          env_of() { helm template ci chart "${V[@]}" "${@:2}" | grep -m1 "name: TENSORFOLD_$1," | sed 's/.*value: "\(.*\)"}/\1/'; }
          check() { got="$(env_of "$1" "${@:3}")"; [[ "$got" == "$2" ]] || { echo "TENSORFOLD_$1=$got, want $2 (${*:3})"; exit 1; }; }
          check THINKING 1
          check THINKING 0 --set model.ablit=true
          check THINKING 1 --set model.ablit=true --set serving.thinking=true
          check THINKING 0 --set serving.thinking=false
          check VISION 0
          check VISION 1 --set serving.vision=true
      - name: recipe tuning env renders on both ranks, derived values follow PARALLEL
        run: |
          set -euo pipefail
          V=(-f chart/ci/test-values.yaml)
          envs() { helm template ci chart "${V[@]}" "$@" | grep -oE 'name: (TF_[A-Z_]+|TENSORFOLD_MEMORY_RESERVE_GIB|NCCL_[A-Z_]+), value: "[^"]*"' | sort | uniq -c; }
          want() { local out; out="$(envs "${@:2}")"; grep -q "2 name: $1\"" <<<"${out//, value: \"/=}" ||
            { echo "want $1 on both ranks (${*:2})"; echo "$out"; exit 1; }; }
          want TF_GLM_DENSE=q4
          want TF_GLM_COMM=roce
          want TF_GLM_MULTI_WINDOW=32
          want TF_ROCE_MAX_KB=512
          want TENSORFOLD_MEMORY_RESERVE_GIB=14.5
          want NCCL_MIN_NCHANNELS=4
          want TF_GLM_MULTI_WINDOW=64 --set serving.parallelRequests=8
          want TF_ROCE_MAX_KB=1024 --set serving.parallelRequests=8
          want TENSORFOLD_MEMORY_RESERVE_GIB=19.6 --set serving.parallelRequests=8
          want TF_GLM_DENSE=fp8 --set tuning.env.TF_GLM_DENSE=fp8
          want NCCL_IB_GID_INDEX=0 --set topology.fabric.gidIndex=0
          if envs --set tuning.env.TF_GLM_DENSE=null | grep -q TF_GLM_DENSE; then echo "null must drop the key"; exit 1; fi
          if envs --set topology.fabric.ncclChannels=null | grep -q NCHANNELS; then echo "null channels must drop NCCL_*NCHANNELS"; exit 1; fi
          dup="$(helm template ci chart "${V[@]}" | yq 'select(.kind == "Deployment") | .spec.template.spec.containers[].env | map(.name) | group_by(.) | map(select(length > 1) | .[0]) | .[]')"
          [[ -z "$dup" ]] || { echo "env names rendered more than once in a container: $dup"; exit 1; }
      - name: kernel cache is per image and per rank
        run: |
          set -euo pipefail
          V=(-f chart/ci/test-values.yaml)
          helm template ci chart "${V[@]}" | grep -q 'emptyDir: {}' || { echo "no kernelCache path must render an emptyDir"; exit 1; }
          out="$(helm template ci chart "${V[@]}" --set kernelCache.hostPath.leader=/c/ --set kernelCache.hostPath.worker=/w --set image.digest=sha256:0123456789abcdef)"
          for want in '/c/v[^"]*-0123456789ab' '/w/v[^"]*-0123456789ab'; do
            if ! grep -q "path: \"${want}\"" <<<"$out"; then
              echo "kernel cache path ${want} not rendered"; grep -A3 'name: kernel-cache' <<<"$out"; exit 1
            fi
          done
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning chart/files/serve.sh chart/files/wait-for-worker.sh scripts/*.sh
      - name: actionlint (workflows, plus shellcheck on run blocks)
        run: |
          set -euo pipefail
          version=1.7.12
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" | tar xz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml
      - name: embedded script syntax
        run: scripts/check-anchors.sh